# Regenerates taps/ from taps.txt and checks that cask2nix can evaluate it. On
# main it also commits the result when it changed; on pull requests it only
# checks.
name: update

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths: &paths [taps.txt, gen-tap.sh, flake.nix, flake.lock, tests/**, .github/workflows/update.yml]
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions: {}

# Runs on main queue so commits land in order; a newer push to a pull request
# makes its older run pointless.
concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # The tests flake reads this repository through Git, so the new data has
      # to be staged before it is evaluated.
      - name: Generate taps
        run: |
          nix run .#gen-tap -- taps.txt taps
          git add -A -- taps

      - name: Evaluate taps with cask2nix
        run: nix flake check ./tests --print-build-logs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request'
        with:
          name: taps
          path: taps
          retention-days: 1

  commit:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      # Replace taps/ as a whole so taps removed from the manifest disappear.
      - name: Replace taps
        run: rm -rf taps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: taps
          path: taps

      - name: Commit changes
        run: |
          git add -A -- taps
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update taps"
          git push
